<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitacora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="session.js"></script>
    <script src="dashboard.js"></script>
</head>
<body>
    <p id="compatibility-error" role="alert" aria-live="assertive" hidden>Este navegador no es compatible con esta aplicación.</p>
    <p id="service-worker-error" role="status" aria-live="polite" hidden>No se pudo activar el modo sin conexión.</p>

    <div class="container" style="max-width: 600px; margin: 20px auto;">
        <div class="welcome-header">
            <h2 id="welcome-msg">Cargando...</h2>
        </div>
        
        <!-- MEJORA: Elemento para mostrar el cargo del trabajador en el sistema -->
        <p id="cargo-display" style="text-align: center; color: #475569; font-weight: 600; margin-bottom: 24px;"></p>
        
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 24px;">
        <h3>Registrar Novedad en Planta</h3>
        
        <!-- Alerta de error interna del formulario -->
        <div id="form-error" style="display: none; background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
            <strong>Error:</strong> <span id="form-error-desc"></span>
        </div>
        <div id="form-status" role="status" aria-live="polite" hidden style="background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;"></div>

        <form id="bitacoraForm" novalidate>
            <!-- Selección de Máquina / Área -->
            <div class="input-group">
                <label for="area">Área General:</label>
                <div class="select-wrapper">
                    <select name="area" id="area" required>
                        <option value="">Seleccione un área</option>
                    </select>
                </div>
            </div> 

            <div class="input-group" id="lineaGroup" hidden>
                <label for="linea">Línea:</label>
                <div class="select-wrapper">
                    <select name="linea" id="linea">
                        <option value="">Seleccione una línea</option>
                    </select>
                </div>
            </div>

            <div class="input-group" id="maquinaGroup" hidden>
                <div id="machineOptions" class="machine-options" hidden></div>
                <label class="lubricacion-toggle">
                    <input type="checkbox" id="lubricacion">
                    Lubricación
                </label>
                <label for="maquina">Máquina:</label>
                <div class="select-wrapper">
                    <select name="maquina" id="maquina" required>
                        <option value="">Seleccione una máquina</option>
                    </select>
                </div>
            </div>

            <!-- Descripción Técnica de la Novedad -->
            <div class="input-group" style="margin-bottom: 20px;">
                <label for="novedad">Descripción de la novedad o falla:</label>
                <textarea lang="es" id="novedad" placeholder="Describa brevemente la actividad realizada..." style="width: 100%; min-height: 100px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; font-family: inherit; box-sizing: border-box; resize: vertical;" required></textarea>
            </div>
            <!-- Duración del Mantenimiento -->
            <div class="input-group" id="duracionGroup" style="margin-bottom: 20px;" hidden>
                <label for="duracionHoras">Duración del mantenimiento:</label>
                <div class="duration-fields">
                    <div>
                        <label for="duracionHoras">Horas:</label>
                        <input type="number" id="duracionHoras" inputmode="numeric" min="0" step="1" placeholder="Ej. 2">
                    </div>
                    <div>
                        <label for="duracionMinutos">Minutos:</label>
                        <input type="number" id="duracionMinutos" inputmode="numeric" min="0" step="1" placeholder="Ej. 30">
                    </div>
                </div>
            </div>

            <button type="submit" style="background-color: #039b47; margin-bottom: 12px;">Guardar Reporte</button>
        </form>

        <!-- Historial de Novedades Local -->
        <h3 style="margin-top: 32px;">Historial de Reportes Recientes</h3>
        <div id="historialContainer" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; min-height: 50px; font-size: 14px; color: #64748b;"></div>

        <!-- Botón de Salida -->
        <button id="logoutBtn" style="background-color: #dc2626; margin-top: 32px;">Cerrar Sesión</button>
    </div>

</body>
</html>
