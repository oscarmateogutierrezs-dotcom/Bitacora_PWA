<!DOCTYPE html>

<html lang="es" class="no-js">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Bitacora Gres Caribe</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#0f172a">
        <script src="session.js"></script>
        <script src="backguard.js"></script>
        <script src="personas.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => requestPrecacheStatus(navigator.serviceWorker))
                    .catch(err => {
                        console.log('Service Worker registration failed: ', err);
                        showServiceWorkerError(err);
                    });
                navigator.serviceWorker.addEventListener('message', (event) => {
                    handlePrecacheStatus(event);
                });
            }

            function redirectToDashboard() {
                window.location.replace('dashboard.html');
            }
            // CORREGIDO: Ahora verifica el Token real que generas abajo, no el viejo "isLoggedIn"
            const token = getSessionToken();
            if (token) {
                try {
                    parseSessionToken(token);
                    if (!isOffline()) {
                        redirectToDashboard();
                    }
                } catch (e) {
                    // Si el token fue manipulado en la consola, limpia todo
                    clearSessionToken();
                }
            }   
            // 2. NORMAL PAGE LOAD: Handle form submissions if they aren't logged in yet
            window.addEventListener('DOMContentLoaded', () => {
                const form = document.getElementById('loginForm');
                const errorAlert = document.getElementById('error-alert');
                const errorTitle = document.getElementById('error-title');
                const errorDesc = document.getElementById('error-desc');
                const nombre = document.getElementById('nombre');
                const cargo = document.getElementById('cargo');
                const persona = document.getElementById('persona');
                const isNativeApp = typeof window.Capacitor?.isNativePlatform === 'function' &&
                    window.Capacitor.isNativePlatform();

                if (isNativeApp) {
                    document.getElementById('nombre-group').hidden = true;
                    document.getElementById('cargo-group').hidden = true;
                    document.getElementById('login-submit').hidden = true;
                    document.getElementById('persona-group').hidden = false;
                    document.getElementById('login-subtitle').textContent = 'Seleccione su nombre para acceder';
                }

                if (!SESSION_APIS_SUPPORTED) {
                    disableUnsupportedControls(document);
                    return;
                }

                if (isOffline()) {
                    showError("Sin conexión", "No hay conexión a internet. Cierre la aplicación, conéctese a la red e inténtelo nuevamente.");
                    disableUnsupportedControls(document);
                    if (isNativeApp) {
                        persona.disabled = true;
                    }
                    return;
                }

                form.addEventListener('submit', (event) => {
                    event.preventDefault();
                    if (!isNativeApp) {
                        iniciarSesion();
                    }
                });

                if (isNativeApp) {
                    if (typeof PERSONAS_CAPACITOR === 'undefined' || !Array.isArray(PERSONAS_CAPACITOR)) {
                        showError("Error de configuración", "No se pudo cargar la lista de personas.");
                        persona.disabled = true;
                        return;
                    }

                    const cargosValidos = new Set(Array.from(cargo.options, option => option.value).filter(Boolean));
                    const configuracionValida = PERSONAS_CAPACITOR.every(personaConfigurada =>
                        personaConfigurada && typeof personaConfigurada.nombre === 'string' &&
                        personaConfigurada.nombre.trim() !== '' &&
                        typeof personaConfigurada.cargo === 'string' &&
                        cargosValidos.has(personaConfigurada.cargo)
                    );
                    if (!configuracionValida || PERSONAS_CAPACITOR.length === 0) {
                        showError("Error de configuración", "Configure personas y cargos válidos en personas.js antes de usar la aplicación.");
                        persona.disabled = true;
                        return;
                    }

                    PERSONAS_CAPACITOR.forEach((personaConfigurada, index) => {
                        persona.add(new Option(personaConfigurada.nombre.trim(), String(index)));
                    });
                    persona.addEventListener('change', () => {
                        if (persona.value === '') {
                            return;
                        }
                        const seleccion = PERSONAS_CAPACITOR[Number(persona.value)];
                        if (!seleccion) {
                            showError("Error de selección", "Seleccione una persona de la lista.");
                            return;
                        }
                        nombre.value = seleccion.nombre.trim();
                        cargo.value = seleccion.cargo;
                        iniciarSesion();
                        persona.value = '';
                    });
                }

                function iniciarSesion() {
                    
                    //Capture the values
                    const usernameValue = nombre.value.trim();
                    const cargoValue = cargo.value.trim();

                    //Hide the previous alert
                    errorAlert.style.display = 'none';

                    //Don't let nulls
                    if (usernameValue === "") {
                        showError("Error de Validación", "El nombre de usuario es obligatorio y no puede quedar vacío.");
                        
                        const input = document.getElementById('nombre');
                        input.classList.add('input-error');
                        setTimeout(() => {
                            input.classList.remove('input-error');
                        }, 1000);
                        return;
                    }

                    if (cargoValue === "") {
                        showError("Error de Validación", "Debe especificar un cargo o posición válida dentro de la empresa.");
                        const input = document.getElementById('cargo');
                        input.classList.add('input-error');
                        setTimeout(() => {
                            input.classList.remove('input-error');
                        }, 1000);
                        return;
                    }

                    const fakeSessionToken = encodeToken(JSON.stringify({
                        nombre: usernameValue,
                        cargo: cargoValue,
                        marker: SESSION_MARKER
                    }));

                    if (!saveSessionToken(fakeSessionToken)) {
                        showError("Error de almacenamiento", "No se pudo guardar la sesión en este navegador.");
                        return;
                    }
                    
                    // Redirect them to the app dashboard
                    window.location.replace('dashboard.html');
                }
                function showError(title, message) {
                    errorTitle.innerText = title;
                    errorDesc.innerText = message;
                    errorAlert.style.display = 'block';
                }
            });
        </script>
    </head>

    <body>
        <p id="compatibility-error" role="alert" aria-live="assertive" hidden>Este navegador no es compatible con esta aplicación.</p>
        <p id="service-worker-error" role="status" aria-live="polite" hidden>No se pudo activar el modo sin conexión.</p>
        <div class="container">
            <button type="button" class="theme-toggle" data-theme-toggle>Modo oscuro</button>
            <img src="logo/logo.jpg" alt="Bitacora Gres Caribe Logo" class="logo">
            <h2>
            Bitacora Gres Caribe
            </h2>
            
            <div class="subtitle" id="login-subtitle">Ingrese su nombre y oficio para acceder</div>

            <form id="loginForm" action="#" method="post" novalidate>
                <div id="error-alert" style="display: none; background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
                    <strong id="error-title" style="display: block; font-weight: 700; margin-bottom: 4px;"></strong>
                    <span id="error-desc"></span>
                </div>

                <div class="input-group" id="persona-group" hidden>
                    <label for="persona">Nombre:</label>
                    <div class="select-wrapper">
                        <select id="persona">
                            <option value="">Seleccione su nombre</option>
                        </select>
                    </div>
                </div>
                <div class="input-group" id="nombre-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Ej. Oscar Gutiérrez" required>
                </div>                
                <div class="input-group" id="cargo-group">
                    <label for="cargo">Cargo:</label>
                    <div class="select-wrapper">
                        <select name="cargo" id="cargo" required>
                            <option value="">Seleccione un cargo</option>
                            <option value="Mecánico">Mecánico</option>
                            <option value="Mecánico Automotriz">Mecánico Automotriz</option>
                            <option value="Mecánico Soldador">Mecánico Soldador</option>
                            <option value="Aprendiz Soldador">Aprendiz Soldador</option>
                            <option value="Eléctrico">Eléctrico</option>
                            <option value="Soldador">Soldador</option>
                            <option value="Nuematico">Nuematico</option>
                            <option value="Metalmecanico">Metalmecanico</option>
                            <option value="Obra Civil">Obra Civil</option>
                            <option value="Contratista">Contratista</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>  

                <button type="submit" id="login-submit">Registrarse</button>

                <button type="button" class="history-button" onclick="window.location.href='historial.html'">Ver historial</button>

            </form>
        </div>

    </body>
</html>
